<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="لوحة إضافة منتجات متجر ElectrophoneAmine.">
  <title>إضافة منتجات | ElectrophoneAmine</title>
  <link rel="stylesheet" href="css/admin.css?v=20261029c">
</head>
<body class="admin-page">
  <aside class="sidebar">
    <a class="brand" href="../index.html">📱 ElectrophoneAmine</a>
    <nav class="menu" aria-label="القائمة الرئيسية">
      <a class="active" href="index.html">➕ إضافة منتجات</a>
      <a href="../index.html">👀 شوف المتجر</a>
    </nav>
    <button id="logout" class="logout" type="button">تسجيل الخروج</button>
  </aside>
  <main class="main">
    <header class="page-heading">
      <div><p class="eyebrow">إدارة المنتجات</p><h1>مرحبا أمين 👋</h1><p>أضف هواتف وإكسسوارات جديدة للمتجر.</p></div>
      <span class="status">● إضافة منتجات فقط</span>
    </header>

    <section class="card section-card">
      <div class="card-head"><div><span class="section-kicker">الكتالوج</span><h2>📱 إضافة هاتف جديد</h2></div><span>كيبان مباشرة فالمتجر</span></div>
      <form id="productForm" class="product-form form-grid">
        <input id="productId" type="hidden">
        <div class="field"><label for="brand">الماركة</label><select id="brand" required><option value="">اختار الماركة</option><option>iPhone</option><option>Samsung</option><option>Redmi</option><option>Xiaomi</option><option>POCO</option><option>Oppo</option><option>Other</option></select></div>
        <div class="field"><label for="model">الموديل</label><input id="model" type="text" placeholder="مثال: 15 Pro Max" required></div>
        <div class="field"><label for="storage">التخزين</label><select id="storage" required><option value="">اختار التخزين</option><option>64GB</option><option>128GB</option><option>256GB</option><option>512GB</option><option>1TB</option></select></div>
        <div class="field"><label for="ram">الرام</label><select id="ram" required><option value="">اختار الرام</option><option>4GB</option><option>6GB</option><option>8GB</option><option>12GB</option><option>16GB</option></select></div>
        <div class="field"><label for="condition">الحالة</label><input id="condition" type="text" value="متوفر" required></div>
        <div class="field"><label for="price">الثمن (DH)</label><input id="price" type="number" min="1" step="1" required></div>
        <div class="field"><label for="oldPrice">الثمن القديم (اختياري)</label><input id="oldPrice" type="number" min="1" step="1"></div>
        <div class="field"><label for="quantity">الكمية</label><input id="quantity" type="number" min="0" step="1" value="1" required></div>
        <div class="field"><label for="phoneImageFile">صورة الهاتف من الجهاز</label><input id="phoneImageFile" type="file" accept="image/*"></div>
        <div class="field"><label for="image">أو رابط الصورة (اختياري)</label><input id="image" type="url" placeholder="https://..."></div>
        <div class="field field-wide"><img id="phoneImagePreview" class="image-preview" alt="معاينة صورة الهاتف" hidden></div>
        <div class="field field-wide"><label for="description">وصف إضافي (اختياري)</label><textarea id="description" rows="3"></textarea></div>
        <div class="form-submit field-wide"><button id="phoneSubmit" class="save" type="submit">إضافة الهاتف ✅</button><p id="phoneMessage" class="form-message" role="status" aria-live="polite"></p></div>
      </form>
    </section>

    <section class="card section-card">
      <div class="card-head"><div><span class="section-kicker">الكتالوج</span><h2>🎧 إضافة إكسسوار جديد</h2></div><span>شواحن، سماعات، كوابل، كفرات</span></div>
      <form id="accessoryForm" class="product-form form-grid">
        <input id="accessoryId" type="hidden">
        <div class="field"><label for="accessoryType">النوع</label><select id="accessoryType" required><option value="">اختار النوع</option><option>شاحن</option><option>سماعات</option><option>كوابل</option><option>باور بانك</option><option>كفرات</option><option>أخرى</option></select></div>
        <div class="field"><label for="accessoryName">الاسم</label><input id="accessoryName" type="text" placeholder="مثال: شاحن سريع USB-C" required></div>
        <div class="field"><label for="accessoryPrice">الثمن (DH)</label><input id="accessoryPrice" type="number" min="1" step="1" required></div>
        <div class="field"><label for="accessoryQuantity">الكمية</label><input id="accessoryQuantity" type="number" min="0" step="1" value="1" required></div>
        <div class="field"><label for="accessoryImageFile">صورة الإكسسوار من الجهاز</label><input id="accessoryImageFile" type="file" accept="image/*"></div>
        <div class="field"><label for="accessoryImage">أو رابط الصورة (اختياري)</label><input id="accessoryImage" type="url" placeholder="https://..."></div>
        <div class="field field-wide"><img id="accessoryImagePreview" class="image-preview" alt="معاينة صورة الإكسسوار" hidden></div>
        <div class="form-submit field-wide"><button id="accessorySubmit" class="save" type="submit">إضافة الإكسسوار ✅</button><p id="accessoryMessage" class="form-message" role="status" aria-live="polite"></p></div>
      </form>
    </section>
  </main>
  <script src="../frontend/js/store.js?v=20261029c"></script>
  <script src="config/password.js?v=20261029c"></script>
  <script src="js/auth.js?v=20261029c"></script>
  <script src="js/admin.js?v=20261029c"></script>
</body>
</html>
