<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://marketphone.shop/salle/">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="description" content="Découvrez tous les téléphones disponibles chez Electrophone Amine, leurs modèles, caractéristiques et prix en dirhams.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_MA">
  <meta property="og:site_name" content="Electrophone Amine">
  <meta property="og:title" content="Tous les téléphones disponibles | Electrophone Amine">
  <meta property="og:description" content="Découvrez les téléphones disponibles, leurs modèles, caractéristiques et prix en dirhams.">
  <meta name="twitter:card" content="summary">
  <meta property="og:url" content="https://marketphone.shop/salle/">
  <title>Téléphones à vendre à Casablanca | Tous les téléphones | Electrophone Amine</title>
  <link rel="stylesheet" href="../frontend/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="logo" href="../index.html">Electrophone<span>Amine</span></a>
      <nav class="nav-links" aria-label="Filtrer les téléphones">
        <a class="active" href="#" data-filter="all">Tout</a>
        <a href="#" data-filter="iphone">iPhone</a>
        <a href="#" data-filter="samsung">Samsung</a>
        <a href="#" data-filter="redmi">Redmi</a>
        <a href="#" data-filter="oppo">Oppo</a>
        <a href="#" data-filter="poco">POCO</a>
        <a href="#" data-filter="xiaomi">Xiaomi</a>
        <a href="#" data-filter="honor">HONOR</a>
        <a href="#" data-filter="infinix">Infinix</a>
        <a href="#" data-filter="vivo">vivo</a>
      </nav>
      <form class="search-box" role="search">
        <input id="productSearch" type="search" placeholder="Rechercher un téléphone..." aria-label="Rechercher un téléphone" autocomplete="off">
        <button type="submit" aria-label="Rechercher">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        </button>
      </form>
      <div class="nav-actions">
        <a class="admin-link" href="../index.html">Accueil</a>
        <a class="cart-btn" href="../panier/index.html">🛒 Panier <span id="cartCount">0</span></a>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="section-heading">
      <h1>Tous les téléphones</h1>
      <span id="productCount" class="product-count"></span>
    </div>
    <div id="products" class="products-grid" aria-live="polite"></div>
  </main>
  <div id="productModal" class="modal" role="dialog" aria-modal="true" aria-label="Détails du téléphone" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <button class="close" type="button" aria-label="Fermer" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
    <div id="imageLightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Afficher la photo du téléphone" hidden>
      <button class="lightbox-close" type="button" aria-label="Fermer la photo agrandie" data-lightbox-close>×</button>
      <button class="lightbox-step lightbox-previous" type="button" aria-label="Photo précédente" data-lightbox-step="-1">‹</button>
      <img id="lightboxImage" class="lightbox-image" alt="">
      <button class="lightbox-step lightbox-next" type="button" aria-label="Photo suivante" data-lightbox-step="1">›</button>
      <span id="lightboxCounter" class="lightbox-counter" aria-live="polite"></span>
    </div>
  </div>
  <script src="../frontend/js/store.js"></script>
  <script src="../frontend/js/main.js"></script>
</body>
</html>
