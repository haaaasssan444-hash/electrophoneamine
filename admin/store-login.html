<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>دخول العامل | Electrophone Amine</title>
  <link rel="stylesheet" href="css/admin.css?v=worker-v1">
  <link rel="stylesheet" href="css/branches.css?v=worker-v1">
  <style>
    .worker-login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7f8fb,#fff1f2);padding:18px}
    .worker-login-box{width:min(410px,100%);padding:28px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.10)}
    .worker-login-box h1{margin:12px 0 5px;font-size:24px}.worker-login-box p{margin:0 0 20px;color:#7a8190;font-size:13px}
    .worker-login-box label{display:block;margin-bottom:6px;color:#667085;font-size:12px;font-weight:900}
    .worker-login-box input{width:100%;height:46px;margin-bottom:14px;border:1px solid #dfe3e8;border-radius:10px;padding:0 12px;font:inherit}
    .worker-login-box button{width:100%;height:46px;border:0;border-radius:10px;background:#dc2626;color:#fff;font:inherit;font-weight:900;cursor:pointer}
    .worker-login-error{min-height:20px;color:#b91c1c!important;margin:10px 0!important;font-weight:800!important}
    .worker-entry-gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(15,23,42,.72);padding:18px;backdrop-filter:blur(6px)}
    .worker-entry-gate[hidden]{display:none}
    .worker-entry-box{width:min(390px,100%);padding:28px;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.28)}
    .worker-entry-box h2{margin:0 0 6px;font-size:22px}.worker-entry-box p{margin:0 0 18px;color:#7a8190;font-size:13px}
    .worker-entry-box label{display:block;margin-bottom:7px;color:#667085;font-size:12px;font-weight:900}
    .worker-entry-box input{width:100%;height:46px;margin-bottom:12px;border:1px solid #dfe3e8;border-radius:10px;padding:0 12px;font:inherit}
    .worker-entry-box button{width:100%;height:46px;border:0;border-radius:10px;background:#dc2626;color:#fff;font:inherit;font-weight:900;cursor:pointer}
    .worker-entry-error{min-height:20px;color:#b91c1c!important;margin:8px 0 0!important;font-weight:800!important}
  </style>
</head>
<body>
  <div id="workerEntryGate" class="worker-entry-gate" role="dialog" aria-modal="true" aria-label="حماية صفحة دخول العمال">
    <form id="workerEntryForm" class="worker-entry-box">
      <span class="owner-avatar">EA</span>
      <h2>صفحة دخول العمال</h2>
      <p>أدخل رمز الدخول للوصول إلى حسابات العمال.</p>
      <label for="workerEntryPassword">رمز الدخول</label>
      <input id="workerEntryPassword" type="password" autocomplete="off" required autofocus>
      <p id="workerEntryError" class="worker-entry-error" role="alert"></p>
      <button type="submit">فتح الصفحة</button>
    </form>
  </div>
  <main class="worker-login">
    <form id="workerLoginForm" class="worker-login-box">
      <span class="owner-avatar">EA</span>
      <h1>دخول العامل</h1>
      <p>سجل دخولك لتسجيل مبيعات المحل ديالك.</p>
      <label for="workerUsername">اسم المستخدم</label>
      <input id="workerUsername" type="text" autocomplete="username" required>
      <label for="workerPassword">كلمة المرور</label>
      <input id="workerPassword" type="password" autocomplete="current-password" required>
      <p id="workerLoginError" class="worker-login-error" role="alert"></p>
      <button type="submit">دخول</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../frontend/js/supabase-config.js?v=worker-v1"></script>
  <script src="../frontend/js/cloud-catalog.js?v=worker-v1"></script>
  <script src="js/store-auth.js?v=worker-v5"></script>
</body>
</html>
