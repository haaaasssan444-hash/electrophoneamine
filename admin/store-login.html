<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Connectez-vous à l’espace employé Electrophone Amine pour consulter les produits et démarrer une session de travail en magasin. Accès réservé aux employés.">
  <meta property="og:type" content="website"><meta property="og:title" content="Connexion des employés | Electrophone Amine - Administration"><meta property="og:description" content="Connexion à l’espace de travail en magasin Electrophone Amine, réservé aux employés autorisés."><meta property="og:image" content="https://marketphone.shop/frontend/assets/electrophone-amine-logo.jpg"><meta property="og:url" content="https://marketphone.shop/admin/store-login.html"><meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon.ico"><link rel="apple-touch-icon" href="../frontend/assets/electrophone-amine-logo.jpg">
  <title>Connexion des employés | Electrophone Amine - Administration</title>
  <link rel="stylesheet" href="css/admin.css?v=worker-v1">
  <link rel="stylesheet" href="css/branches.css?v=french-admin-v1">
  <style>
    .worker-login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7f8fb,#fff1f2);padding:18px}
    .worker-login-box{width:min(410px,100%);padding:28px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.10)}
    .worker-login-box h1{margin:12px 0 5px;font-size:24px}.worker-login-box p{margin:0 0 20px;color:#7a8190;font-size:13px}
    .worker-login-box label{display:block;margin-bottom:6px;color:#667085;font-size:12px;font-weight:900}
    .worker-login-box input{width:100%;height:46px;margin-bottom:14px;border:1px solid #dfe3e8;border-radius:10px;padding:0 12px;font:inherit}
    .worker-login-box button{width:100%;height:46px;border:0;border-radius:10px;background:#dc2626;color:#fff;font:inherit;font-weight:900;cursor:pointer}
    .worker-login-error{min-height:20px;color:#b91c1c!important;margin:10px 0!important;font-weight:800!important}
  </style>
</head>
<body>
  <main class="worker-login">
    <form id="workerLoginForm" class="worker-login-box">
      <span class="owner-avatar">EA</span>
      <h1>Connexion employé</h1>
      <p>Connectez-vous pour enregistrer les ventes du magasin.</p>
      <label for="workerUsername">Nom d’utilisateur</label>
      <input id="workerUsername" type="text" autocomplete="username" required>
      <label for="workerPassword">Mot de passe</label>
      <input id="workerPassword" type="password" autocomplete="current-password" required>
      <p id="workerLoginError" class="worker-login-error" role="alert"></p>
      <button type="submit">Se connecter</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../frontend/js/supabase-config.js?v=worker-v9"></script>
  <script src="../frontend/js/cloud-catalog.js?v=20261110a"></script>
  <script src="js/store-auth.js?v=french-admin-v1"></script>
</body>
</html>
