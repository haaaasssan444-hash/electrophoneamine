<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>Connexion administrateur</title><link rel="stylesheet" href="css/admin.css"></head>
<body class="login-body">
<div class="login-box">
<h2>🔐 Electrophone Amine</h2><p class="login-subtitle">Connexion administrateur</p>
<form id="loginForm">
  <label for="accessCode">Code d’accès</label>
  <input id="accessCode" name="accessCode" type="password" autocomplete="current-password" required autofocus>
  <p id="error" role="alert" style="color:#fb7185;margin-top:8px"></p>
  <button type="submit">Se connecter</button>
</form>
</div>
<script src="config/password.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
